<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Daily Drip</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: black;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #333;
    }

    .summary {
      margin-top: 20px;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }

    .summary p {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
    }

    .total {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Checkout</h1>

    <input type="text" id="name" placeholder="Full Name" required>
    <input type="tel" id="phone" placeholder="Phone Number" required>
    <input type="text" id="house" placeholder="House Number" required>
    <input type="text" id="street" placeholder="Street Address" required>
    <input type="text" id="city" placeholder="City" required>
    <select id="state" required>
  <option value="">Select State / UT</option>

  <option>Andhra Pradesh</option>
  <option>Arunachal Pradesh</option>
  <option>Assam</option>
  <option>Bihar</option>
  <option>Chhattisgarh</option>
  <option>Goa</option>
  <option>Gujarat</option>
  <option>Haryana</option>
  <option>Himachal Pradesh</option>
  <option>Jharkhand</option>
  <option>Karnataka</option>
  <option>Kerala</option>
  <option>Madhya Pradesh</option>
  <option>Maharashtra</option>
  <option>Manipur</option>
  <option>Meghalaya</option>
  <option>Mizoram</option>
  <option>Nagaland</option>
  <option>Odisha</option>
  <option>Punjab</option>
  <option>Rajasthan</option>
  <option>Sikkim</option>
  <option>Tamil Nadu</option>
  <option>Telangana</option>
  <option>Tripura</option>
  <option>Uttar Pradesh</option>
  <option>Uttarakhand</option>
  <option>West Bengal</option>

  <option>Andaman and Nicobar Islands</option>
  <option>Chandigarh</option>
  <option>Dadra and Nagar Haveli and Daman and Diu</option>
  <option>Delhi</option>
  <option>Jammu and Kashmir</option>
  <option>Ladakh</option>
  <option>Lakshadweep</option>
  <option>Puducherry</option>
</select>

    <input type="text" id="pincode" placeholder="Pincode/ZIP Code" required>

    <div class="summary" id="orderSummary"></div>

    <button onclick="placeOrder()">Place Order</button>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function renderSummary() {
      const summaryDiv = document.getElementById("orderSummary");
      summaryDiv.innerHTML = "<h3>Order Summary</h3>";

      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        summaryDiv.innerHTML += `
          <p>
            <span>${item.name} × ${item.qty}</span>
            <span>$${itemTotal}</span>
          </p>
        `;
      });

      summaryDiv.innerHTML += `
        <p class="total">
          <span>Total</span>
          <span>$${total}</span>
        </p>
      `;
    }

function placeOrder() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const house = document.getElementById("house").value.trim();
  const street = document.getElementById("street").value.trim();
  const city = document.getElementById("city").value.trim();
  const state = document.getElementById("state").value.trim();
  const pincode = document.getElementById("pincode").value.trim();

  if (!name || !phone || !house || !street || !city || !state || !pincode) {
    alert("Please fill all address details");
    return;
  }

  const addressData = {
    name,
    phone,
    house,
    street,
    city,
    state,
    pincode
  };

  localStorage.setItem("address", JSON.stringify(addressData));
  localStorage.removeItem("cart");

  window.location.href = "thank.html";
}

const savedAddress = JSON.parse(localStorage.getItem("address"));
if (savedAddress) {
  name.value = savedAddress.name;
  phone.value = savedAddress.phone;
  house.value = savedAddress.house;
  street.value = savedAddress.street;
  city.value = savedAddress.city;
  state.value = savedAddress.state;
  pincode.value = savedAddress.pincode;
}



    renderSummary();
  </script>

</body>
</html>
